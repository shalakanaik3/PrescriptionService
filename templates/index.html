<!DOCTYPE html>
<html>
<head>
    <title>Prescription Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>🏥 Prescription Management System</h2>
    <hr>
    
    <h4>Create New Prescription</h4>
    <div class="row g-3">
        <div class="col-md-2"><input type="number" id="appId" class="form-control" placeholder="Appt ID"></div>
        <div class="col-md-2"><input type="number" id="patId" class="form-control" placeholder="Patient ID"></div>
        <div class="col-md-3"><input type="text" id="med" class="form-control" placeholder="Medication"></div>
        <div class="col-md-2"><input type="text" id="dos" class="form-control" placeholder="Dosage"></div>
        <div class="col-md-1"><input type="number" id="days" class="form-control" placeholder="Days"></div>
        <div class="col-md-2"><button onclick="addPrescription()" class="btn btn-primary w-100">Save</button></div>
    </div>

    <h4 class="mt-5">Recent Prescriptions (from CSV)</h4>
    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>ID</th><th>Appt ID</th><th>Patient</th><th>Medication</th><th>Dosage</th><th>Issued At</th>
            </tr>
        </thead>
        <tbody id="presc-table"></tbody>
    </table>

    <script>
        async function loadPrescriptions() {
            const res = await fetch('/v1/prescriptions');
            const data = await res.json();
            const table = document.getElementById('presc-table');
            table.innerHTML = data.reverse().map(p => `
                <tr>
                    <td>${p.prescription_id}</td>
                    <td>${p.appointment_id}</td>
                    <td>Patient #${p.patient_id}</td>
                    <td><b>${p.medication}</b></td>
                    <td>${p.dosage}</td>
                    <td>${new Date(p.issued_at).toLocaleDateString()}</td>
                </tr>
            `).join('');
        }

        async function addPrescription() {
            const body = {
                appointment_id: document.getElementById('appId').value,
                patient_id: document.getElementById('patId').value,
                doctor_id: 1, // Default for demo
                medication: document.getElementById('med').value,
                dosage: document.getElementById('dos').value,
                days: document.getElementById('days').value
            };
            await fetch('/v1/prescriptions', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            loadPrescriptions();
        }
        loadPrescriptions();
    </script>
</body>
</html>
